version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      - DATABASE_URL=sqlite:///data/green_insights.db
      - FLASK_DEBUG=false
    volumes:
      - ./data:/app/data
    command: ["sh", "-c", "python data/seed_data.py && python backend/app.py"]
    
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:5050
    depends_on:
      - backend
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
