# End-to-end pipeline configuration. Stages run in order; each writes a checkpoint
# marker, so a resubmitted job resumes where it stopped.

run_name: gcip-ps1

data:
  n_customers: 30000
  chunk_size: 1000
  workers: null            # default: all CPUs but one

as_of:
  training_cutoff: "2026-03-31"   # features up to here, labels in the six months after
  live: "2026-09-30"              # scoring date for recommendations and the dashboards
  history_months: 12

categoriser:
  unseen_merchant_share: 0.20     # merchants held out entirely to test generalisation
  max_train_signatures: 100000     # FinBERT is slower than sparse TF-IDF; representative weighted sample
  lookup_min_count: 3
  lookup_min_purity: 0.95
  finbert:
    model: ProsusAI/finbert
    batch_size: 128
    max_length: 96
    logistic_C: 6.0

propensity:
  products: [GP01, GP02, GP03, GP04, GP05, GP06]
  optuna_trials: 40
  bootstrap_models: 5
  learning_rate: 0.03
  early_stopping_rounds: 100
  top_k_share: 0.10
  ablations: [price_normalisation_off, coverage_flags_off, calibration_off, rules_only_categories]

recommend:
  max_per_customer: 3
  # A product is shown only when all of these hold (checked in this order after eligibility, consent and memory):
  require_impact: true           # the carbon and money statements can be computed (no suggestion without them)
  min_lift: 2.0                  # calibrated propensity >= 2 x the product's take-up rate among eligible training customers
  min_confidence: 0.45           # "low" confidence (thin or inconsistent evidence) is not shown
  min_co2e_kg_per_year: 100      # a green suggestion must avoid at least this much a year...
  co2e_exempt: [GP04]            # ...except Paperless, whose saving per customer is small by nature (required product)
  cooldown_days: {dismissed: 90, not_interested: 180}
  clicked_priority_boost: 0.10

llm:
  # Explanations are written by templates for every suggestion. An LLM only rewrites their body (the compliance sentence
  # with the data date and disclaimer is fixed text), nothing is trained, and every rewrite must pass the guards
  # (gcip.explain.guards) or the template is kept. Without the provider (no key, no GPU) everything stays as templates.
  provider: gemini               # gemini (API key in GEMINI_API_KEY, e.g. gcip/.env) | local (offline GPU) | none
  model: gemini-3.8-flash
  fallback_models: [gemini-3.5-flash, gemini-3.1-flash-lite]   # tried in order when a model's daily quota is used up
  concurrency: 4                 # parallel API requests in the explain_llm stage
  local_model: Qwen/Qwen2.5-1.5B-Instruct   # provider local: pip install -r requirements-llm.txt
  dtype: float16
  max_new_tokens: 300
  batch_size: 16
  eval_set_size: 360             # 60 per product, rewritten and checked by the explain_llm stage

memory:
  replay_customers: 300
  rounds: 3

insights:
  segments_k: 6
