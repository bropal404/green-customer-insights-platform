# UK merchant lexicon for the synthetic bank.
#
# Each sub-category lists real UK merchants (names only, used as payees in
# synthetic statements), descriptor variants and a merchant category code (MCC).
# Placeholders in variants: {loc} town, {store} store number, {ref} reference,
# {reg} number plate, {la} local authority, {surname}, {first}, {employer}, {num}.
# `regions` limits a merchant to listed regions; otherwise it is national.
# `green` (0-1) marks merchants that a green-minded customer is likelier to use.
# `local_patterns` generate small, mostly unique local businesses so that the
# categoriser has to generalise beyond memorised names.

sub_categories:

